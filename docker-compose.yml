version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: legal-postgres

    environment:
      POSTGRES_DB: legal_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:

    build: ./backend

    container_name: legal-backend

    depends_on:
      - postgres

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app


  frontend:

    build: ./frontend

    container_name: legal-frontend

    depends_on:
      - backend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules


volumes:

  postgres_data: